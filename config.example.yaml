server:
  port: 8080
  timeout: "10s"

database:
  url: "postgres://shortener:password@localhost:5432/url_shortener?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_lifetime: "1h"
  max_idle_time: "30m"

redis:
  url: "redis://:password@localhost:6379/0"
  max_conns: 10
  min_idle_conns: 2
  conn_max_idle_time: "5m"

service:
  short_domain: "short.link"
  worker_id: -1  # -1 means auto-detect
  environment: "development"

rate_limit:
  per_ip: 100
  per_ip_burst: 120
  window: "1m"

logging:
  level: "info"

gcp:
  project: "your-gcp-project-id"
  region: "us-central1"
